name: Test Firestore Rules

# Jalan di setiap PR yang menyentuh rules atau testnya, supaya perubahan
# rules yang merusak alur (seperti bug "user tidak bisa gabung workspace"
# yang ditemukan test ini) ketahuan sebelum merge, bukan setelah rilis.
on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore-rules.test.ts"
      - "vitest.config.ts"
      - "package.json"
  workflow_dispatch: {}

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Firestore Emulator (dipakai npm run test:rules) jalan di atas JDK,
      # dan butuh versi 21+ — runner ubuntu-latest bawaan tidak selalu
      # punya versi itu tersedia.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run test:rules
