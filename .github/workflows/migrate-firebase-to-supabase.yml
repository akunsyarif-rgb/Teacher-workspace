name: Migrate Firebase to Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no Supabase writes)'
        required: true
        default: true
        type: boolean
      workspace_id:
        description: 'Optional workspace ID filter; leave empty for all workspaces'
        required: false
        default: ''
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration inputs
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$FIREBASE_ADMIN_SERVICE_ACCOUNT" || (echo 'Missing FIREBASE_ADMIN_SERVICE_ACCOUNT' && exit 1)
          test -n "$SUPABASE_URL" || (echo 'Missing SUPABASE_URL' && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo 'Missing SUPABASE_SECRET_KEY' && exit 1)

      - name: Dry-run migration
        if: ${{ inputs.dry_run == true }}
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          CMD="node scripts/migrate-firestore-to-supabase.mjs --dry-run"
          if [ -n "${{ inputs.workspace_id }}" ]; then CMD="$CMD --workspace=${{ inputs.workspace_id }}"; fi
          $CMD

      - name: Execute migration
        if: ${{ inputs.dry_run == false }}
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          CMD="node scripts/migrate-firestore-to-supabase.mjs"
          if [ -n "${{ inputs.workspace_id }}" ]; then CMD="$CMD --workspace=${{ inputs.workspace_id }}"; fi
          $CMD
