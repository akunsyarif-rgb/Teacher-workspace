name: Deploy Firestore & Storage Rules

# Deploy firestore.rules, firestore.indexes.json, DAN storage.rules ke
# Firebase secara otomatis begitu berubah di main — supaya rules/index
# tidak lagi pernah ditempel manual ke Firebase Console (proses manual itu
# yang sebelumnya menyebabkan rules aplikasi ini tertimpa oleh rules
# aplikasi lain tanpa disadari). Index baru butuh waktu build di sisi
# Firebase (tidak instan) terutama kalau koleksinya sudah besar — query
# yang butuh index itu akan gagal sementara sampai build-nya selesai.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      # WAJIB — data siswa/guru (students, student_login_codes, dst.)
      # bergantung langsung pada rules ini. Kalau step ini gagal, job HARUS
      # gagal (tidak ada continue-on-error): tidak ada gunanya lanjut ke
      # Storage kalau Firestore rules sendiri belum tentu ter-update.
      - name: Deploy Firestore rules dan indexes (WAJIB)
        id: deploy_firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive

      # OPSIONAL — dipisah dari Firestore supaya masalah izin service
      # account khusus Storage API (mis. serviceusage.googleapis.com)
      # tidak lagi ikut menggagalkan deploy Firestore rules yang wajib.
      # continue-on-error DISENGAJA: kegagalan di sini tetap tercatat
      # sebagai step "failed" (bukan disembunyikan/di-`|| true`-kan) dan
      # dilaporkan eksplisit di step berikutnya — hanya tidak menghentikan
      # job. Diambil sengaja TIDAK memperluas permission service account
      # cuma demi meloloskan Storage; itu keputusan terpisah yang perlu
      # ditinjau sendiri, bukan dikerjakan lewat workflow ini.
      - name: Deploy Storage rules (opsional)
        id: deploy_storage
        if: always()
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive

      - name: Tandai kegagalan Storage secara eksplisit
        if: always() && steps.deploy_storage.outcome == 'failure'
        run: |
          echo "::warning title=Storage rules gagal ter-deploy::Deploy Storage rules gagal (lihat log step 'Deploy Storage rules (opsional)' di atas). Ini TIDAK menggagalkan job karena Storage bersifat opsional, tapi storage.rules yang aktif sekarang kemungkinan bukan versi terbaru repo ini dan perlu ditindaklanjuti terpisah — jangan diabaikan."

      - name: Ringkasan status deployment
        if: always()
        run: |
          {
            echo "## Ringkasan Deploy Rules"
            echo ""
            echo "| Resource | Wajib? | Status |"
            echo "|---|---|---|"
            echo "| Firestore (rules + indexes) | Ya | \`${{ steps.deploy_firestore.outcome }}\` |"
            echo "| Storage rules | Tidak | \`${{ steps.deploy_storage.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
