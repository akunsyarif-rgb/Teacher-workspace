name: Deploy Firestore Rules & Indexes

# Deploy firestore.rules DAN firestore.indexes.json ke Firebase secara
# otomatis begitu berubah di main — supaya rules/index tidak lagi pernah
# ditempel manual ke Firebase Console (proses manual itu yang sebelumnya
# menyebabkan rules aplikasi ini tertimpa oleh rules aplikasi lain tanpa
# disadari). Index baru butuh waktu build di sisi Firebase (tidak instan)
# terutama kalau koleksinya sudah besar — query yang butuh index itu akan
# gagal sementara sampai build-nya selesai.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
