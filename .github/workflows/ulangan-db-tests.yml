name: Ulangan Harian - tes database lokal

# Menjalankan tes migrasi/RLS/RPC Ulangan Harian pada Postgres 16 SEMENTARA di runner (service container) dan PostgREST resmi.
# GRATIS dan terisolasi: TIDAK memakai Supabase (tanpa secret, tanpa project/branch), tidak menyentuh Workflow maupun SmadaExam.
# Ini BUKAN validasi Supabase cloud (gateway, Third-Party Auth Firebase, advisor); itu tetap butuh staging yang disetujui.
on:
  # push ke branch fitur: workflow baru yang belum ada di branch default tidak bisa di-dispatch, tetapi push tetap menjalankannya.
  push:
    branches: ["feat/ulangan-harian-supabase"]
    paths:
      - "supabase/**"
      - "tests/**"
      - "lib/**"
      - "app/api/ulangan/**"
      - ".github/workflows/ulangan-db-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tests/ulangan*"
      - "tests/rls/**"
      - "lib/server/ulangan*"
      - "lib/repositories/ulanganRepository.ts"
      - ".github/workflows/ulangan-db-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ulangan-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RLS_TEST_ADMIN_URL: postgresql://postgres:pw@127.0.0.1:5432/postgres
      POSTGREST_VERSION: v12.2.3
      # sha256 tarball linux-static-x64 v12.2.3 (dihitung dari unduhan resmi saat audit 2026-10-10)
      POSTGREST_SHA256: 9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Unduh PostgREST (verifikasi checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/pgrst"
          curl -fsSL -o "$RUNNER_TEMP/pgrst.tar.xz" "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          echo "${POSTGREST_SHA256}  $RUNNER_TEMP/pgrst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/pgrst.tar.xz" -C "$RUNNER_TEMP/pgrst"
          echo "POSTGREST_BIN=$RUNNER_TEMP/pgrst/postgrest" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Tes Ulangan Harian + paritas RLS + migrasi
        run: >-
          npx vitest run
          tests/ulangan-harian.test.ts tests/ulangan-migration.test.ts tests/ulangan-postgrest.test.ts
          tests/ulangan-identity.test.ts tests/ulangan-identity-sim.test.ts tests/ulangan-client.test.ts
          tests/workspace-server-supabase.test.ts
          tests/rls-parity.test.ts tests/rls-migration.test.ts
